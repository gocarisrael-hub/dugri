    <meta name="dugri:page" content="coupons.html" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#8ca287" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="דוגרי" />

    <link
      rel="stylesheet"
      href="/assets/fonts/fonts.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript><link rel="stylesheet" href="/assets/fonts/fonts.css" /></noscript>
    <link rel="stylesheet" href="/css/tokens.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Heebo', Arial, sans-serif;
        background: #f7f4ef;
        color: #23201c;
        padding: 22px 16px 60px;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
      }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
      }
      .nav a {
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        border: 1px solid #e4ddd0;
        background: #fff;
        color: #5c7357;
        border-radius: 99px;
        padding: 6px 14px;
      }
      .nav a.active {
        background: #8ca287;
        border-color: #8ca287;
        color: #fff;
      }
      h1 {
        font-size: 24px;
        font-weight: 900;
        margin-bottom: 4px;
      }
      .sub {
        color: #6b645b;
        margin-bottom: 18px;
      }
      .msg {
        background: #fff;
        border: 1px solid #e4ddd0;
        border-radius: 14px;
        padding: 20px;
        text-align: center;
      }
      .panel {
        background: #fff;
        border: 1px solid #e4ddd0;
        border-radius: 14px;
        padding: 16px 18px;
        margin-bottom: 18px;
      }
      .panel h2 {
        font-size: 16px;
        font-weight: 800;
        color: #5c7357;
        margin-bottom: 12px;
      }
      .form {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        font-size: 12.5px;
        color: #6b645b;
        font-weight: 700;
      }
      .field input {
        font: inherit;
        font-size: 14px;
        border: 1px solid #e4ddd0;
        border-radius: 9px;
        padding: 8px 10px;
        background: #fff;
        color: #23201c;
      }
      #code {
        text-transform: uppercase;
        width: 160px;
      }
      #pct {
        width: 110px;
      }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        border: 1px solid #8ca287;
        background: #8ca287;
        color: #fff;
        border-radius: 9px;
        padding: 9px 16px;
        margin: 0;
      }
      button.ghost {
        background: #fff;
        color: #8ca287;
        padding: 6px 10px;
      }
      button.danger {
        border-color: #6f8a6a;
        color: #6f8a6a;
        background: #fff;
        padding: 6px 10px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .err {
        color: #6f8a6a;
        font-size: 13px;
        font-weight: 700;
        margin-top: 10px;
        min-height: 18px;
      }
      #content {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border: 1px solid #e4ddd0;
        border-radius: 14px;
        overflow: hidden;
        font-size: 14px;
      }
      th,
      td {
        text-align: right;
        padding: 10px 12px;
        border-bottom: 1px solid #efe9df;
        vertical-align: middle;
      }
      th {
        background: #f3e6e3;
        color: #5c7357;
        font-size: 12.5px;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .code {
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .pill {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 99px;
        font-weight: 700;
        font-size: 12.5px;
      }
      .on {
        background: #e6f6ee;
        color: #1f7a4d;
      }
      .off {
        background: #efe9df;
        color: #6b645b;
      }
      .muted {
        color: #6b645b;
        font-size: 12.5px;
      }
    </style>
    <script src="js/editor.js" defer></script>
  </head>
  <body>
    <div class="wrap">
      <nav class="nav" id="nav">
        <a data-page="dashboard.html">לוח בקרה</a>
        <a data-page="admin.html">ניהול הזמנות</a>
        <a data-page="coupons.html" class="active">ניהול קופונים</a>
        <a data-page="design-codes.html">קודי עיצוב</a>
        <a data-page="admin-designs.html">עיצובים</a>
        <a data-page="admin-wordlists.html">רשימות מילים</a>
        <a data-page="admin-playbook.html">פלייבוק</a>
        <a data-page="admin-texts.html">הודעות וטקסטים</a>
        <a data-page="admin-faq.html">שאלות נפוצות</a>
        <a data-page="admin-newgame.html">המשחק החדש</a>
        <a data-page="admin-preview.html">תצוגה מקדימה</a>
        <a data-page="admin-features.html">פיצ׳רים</a>
        <a data-page="admin-pricing.html">מחירים</a>
        <a data-page="admin-images.html">תמונות מוצר</a>
        <a data-page="admin-inventory.html">מלאי</a>
      </nav>
      <h1>ניהול קופונים · דוגרי</h1>
      <div class="sub" id="sub">טוען…</div>

      <div class="panel" id="createPanel" hidden>
        <h2>קופון חדש</h2>
        <form class="form" id="form">
          <div class="field">
            <label for="code">קוד</label>
            <input id="code" type="text" autocomplete="off" placeholder="SUMMER10" />
          </div>
          <div class="field">
            <label for="pct">אחוז הנחה</label>
            <input id="pct" type="number" min="1" max="100" step="1" placeholder="10" />
          </div>
          <div class="field">
            <label for="until">בתוקף עד (ריק = ללא תפוגה)</label>
            <input id="until" type="date" />
          </div>
          <!-- A coupon becomes a BLOGGER's code by getting a name and a rate.
               Left empty it is an ordinary discount code, exactly as before. -->
          <div class="field">
            <label for="partner">שם המשווקת (ריק = קופון רגיל)</label>
            <input id="partner" type="text" autocomplete="off" placeholder="שם הבלוגרית" />
          </div>
          <div class="field">
            <label for="ctype">היא מרוויחה</label>
            <select id="ctype">
              <option value="">— לא משווקת —</option>
              <option value="fixed">סכום קבוע להזמנה (₪)</option>
              <option value="percent">אחוז מהמשחק</option>
            </select>
          </div>
          <div class="field">
            <label for="cvalue">כמה</label>
            <input id="cvalue" type="number" min="1" step="1" placeholder="30" />
          </div>
          <button type="submit" id="submitBtn">צור קופון</button>
        </form>
        <div class="err" id="err"></div>
      </div>

      <div id="content"></div>
    </div>

    <script type="module">
      const key = new URLSearchParams(location.search).get('key') || '';
      // Carry the admin key across the three linked admin pages.
      for (const a of document.querySelectorAll('#nav a')) {
        a.href = a.dataset.page + (key ? '?key=' + encodeURIComponent(key) : '');
      }

      const sub = document.getElementById('sub');
      const content = document.getElementById('content');
      const createPanel = document.getElementById('createPanel');
      const form = document.getElementById('form');
      const codeEl = document.getElementById('code');
      const pctEl = document.getElementById('pct');
      const untilEl = document.getElementById('until');
      const partnerEl = document.getElementById('partner');
      const ctypeEl = document.getElementById('ctype');
      const cvalueEl = document.getElementById('cvalue');
      const submitBtn = document.getElementById('submitBtn');
      const errEl = document.getElementById('err');

      // Human-readable Hebrew for the server's terse error codes (400 validation
      // plus the 403 wrong-key / 503 admin-disabled cases).
      const ERR_HE = {
        'bad code': 'קוד לא תקין (3–20 תווים, אותיות וספרות בלבד).',
        'bad discount_pct': 'אחוז הנחה חייב להיות מספר שלם בין 1 ל-100.',
        'bad valid_until': 'תאריך תפוגה לא תקין.',
        duplicate: 'קוד כזה כבר קיים.',
        forbidden: 'מפתח גישה שגוי.',
        'admin disabled: set ADMIN_KEY': 'ניהול מושבת בשרת (חסר ADMIN_KEY).',
      };

      const withKey = (path) =>
        path + (path.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(key);

      // valid_until is a plain 'YYYY-MM-DD' calendar date. Parse the parts as a
      // LOCAL date (new Date('YYYY-MM-DD') is UTC midnight, which renders one day
      // early in negative-UTC timezones). Fall back to the raw string if malformed.
      function fmtDate(ymd) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd));
        if (!m) return ymd;
        const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
        return d.toLocaleDateString('he-IL', {
          day: '2-digit',
          month: '2-digit',
          year: '2-digit',
        });
      }

      const money = (n) => Number(n || 0).toLocaleString('he-IL') + ' ₪';

      // The owner's view of ONE partner's money, opened under her row. It reads
      // the SAME endpoint her own page reads, so the two can never disagree
      // about what is owed — the commonest way a partnership goes sour.
      async function toggleReport(c, tr) {
        const open = tr.nextSibling && tr.nextSibling.dataset && tr.nextSibling.dataset.report;
        if (open) return tr.nextSibling.remove();
        const row = document.createElement('tr');
        row.dataset.report = c.id;
        const cell = document.createElement('td');
        cell.colSpan = 7;
        cell.textContent = 'טוען…';
        row.appendChild(cell);
        tr.after(row);

        let rep = null;
        try {
          const r = await fetch(withKey('/api/admin/coupons/' + c.id + '/report'));
          rep = r.ok ? await r.json() : null;
        } catch {
          rep = null;
        }
        if (!rep) {
          cell.textContent = 'לא הצלחנו לטעון את הדוח.';
          return;
        }
        cell.textContent = '';

        const sum = document.createElement('p');
        sum.innerHTML =
          '<b>' +
          rep.totals.sales +
          '</b> מכירות · הרוויחה <b>' +
          money(rep.totals.earned) +
          '</b> · שולם <b>' +
          money(rep.totals.paid_out) +
          '</b> · נותר לתשלום <b>' +
          money(rep.totals.outstanding) +
          '</b>';
        cell.appendChild(sum);

        // Recording a payment is the only write here. It never edits a sale —
        // what was earned is history.
        const f = document.createElement('form');
        f.className = 'form';
        f.style.marginTop = '10px';
        const amt = document.createElement('input');
        amt.type = 'number';
        amt.min = '1';
        amt.step = '1';
        amt.placeholder = 'סכום ששולם';
        const note = document.createElement('input');
        note.type = 'text';
        note.placeholder = 'הערה (ביט, העברה…)';
        const btn = document.createElement('button');
        btn.type = 'submit';
        btn.textContent = 'רשום תשלום';
        f.append(amt, note, btn);
        f.onsubmit = async (e) => {
          e.preventDefault();
          btn.disabled = true;
          try {
            await fetch(withKey('/api/admin/coupons/' + c.id + '/payouts'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ amount: Number(amt.value), note: note.value }),
            });
          } finally {
            btn.disabled = false;
          }
          row.remove();
          toggleReport(c, tr);
        };
        cell.appendChild(f);

        if (rep.sales.length) {
          const t = document.createElement('table');
          t.innerHTML =
            '<thead><tr><th>הזמנה</th><th>תאריך</th><th>שולם</th><th>הלקוחה חסכה</th><th>הרווח שלה</th></tr></thead>';
          const body = document.createElement('tbody');
          for (const sale of rep.sales) {
            const r2 = document.createElement('tr');
            for (const v of [
              sale.order_no || '—',
              sale.paid_at ? fmtDate(sale.paid_at.slice(0, 10)) : '—',
              money(sale.charged_total),
              money(sale.customer_saved),
              money(sale.amount),
            ]) {
              const td = document.createElement('td');
              td.textContent = v;
              r2.appendChild(td);
            }
            body.appendChild(r2);
          }
          t.appendChild(body);
          cell.appendChild(t);
        }
      }

      function render(coupons) {
        if (!coupons.length) {
          content.innerHTML = '<div class="msg">אין קופונים עדיין.</div>';
          return;
        }
        const table = document.createElement('table');
        table.innerHTML =
          '<thead><tr><th>קוד</th><th>הנחה</th><th>משווקת</th><th>בתוקף עד</th><th>סטטוס</th><th>שימושים</th><th>ניהול</th></tr></thead>';
        const tb = document.createElement('tbody');
        for (const c of coupons) {
          const tr = document.createElement('tr');

          const tdCode = document.createElement('td');
          tdCode.className = 'code';
          tdCode.textContent = c.code;

          const tdPct = document.createElement('td');
          tdPct.textContent = c.discount_pct + '%';

          // WHO EARNS FROM THIS CODE, and what she earns — the two facts that
          // turn a discount into a partnership, so they belong in the row rather
          // than behind a click.
          const tdPartner = document.createElement('td');
          if (c.commission_type) {
            const name = document.createElement('div');
            name.textContent = c.partner_name || '—';
            const rate = document.createElement('div');
            rate.className = 'muted';
            rate.textContent =
              c.commission_type === 'fixed'
                ? c.commission_value + ' ₪ להזמנה'
                : c.commission_value + '% מהמשחק';
            tdPartner.appendChild(name);
            tdPartner.appendChild(rate);
          } else {
            tdPartner.className = 'muted';
            tdPartner.textContent = '—';
          }

          const tdUntil = document.createElement('td');
          if (c.valid_until) {
            tdUntil.textContent = fmtDate(c.valid_until);
          } else {
            tdUntil.className = 'muted';
            tdUntil.textContent = 'ללא תפוגה';
          }

          const tdStatus = document.createElement('td');
          const pill = document.createElement('span');
          pill.className = 'pill ' + (c.active ? 'on' : 'off');
          pill.textContent = c.active ? 'פעיל' : 'כבוי';
          tdStatus.appendChild(pill);

          const tdUses = document.createElement('td');
          tdUses.textContent = c.uses || 0;

          const tdManage = document.createElement('td');
          const toggleBtn = document.createElement('button');
          toggleBtn.className = 'ghost';
          toggleBtn.textContent = c.active ? 'כבה' : 'הפעל';
          toggleBtn.onclick = async () => {
            toggleBtn.disabled = true;
            // Reload regardless of outcome: on a 404 (coupon changed/removed in
            // another tab) this reconciles the ghost row with server state.
            await apiToggle(c.id, !c.active);
            load();
          };
          const delBtn = document.createElement('button');
          delBtn.className = 'danger';
          delBtn.textContent = 'מחק';
          delBtn.onclick = async () => {
            if (!confirm('למחוק את הקופון ' + c.code + '?')) return;
            delBtn.disabled = true;
            await apiDelete(c.id);
            load();
          };
          tdManage.appendChild(toggleBtn);
          tdManage.appendChild(document.createTextNode(' '));
          tdManage.appendChild(delBtn);

          // A partner coupon carries two more actions: her private link, and the
          // money. Both are hidden for an ordinary discount code, which has
          // neither.
          if (c.commission_type && c.report_token) {
            const linkBtn = document.createElement('button');
            linkBtn.className = 'ghost';
            linkBtn.textContent = 'העתק קישור לדוח';
            linkBtn.onclick = () => {
              const url = location.origin + '/partner.html?t=' + c.report_token;
              navigator.clipboard.writeText(url).then(() => {
                linkBtn.textContent = 'הועתק ✓';
                setTimeout(() => (linkBtn.textContent = 'העתק קישור לדוח'), 1500);
              });
            };
            const moneyBtn = document.createElement('button');
            moneyBtn.className = 'ghost';
            moneyBtn.textContent = 'רווחים ותשלומים';
            moneyBtn.onclick = () => toggleReport(c, tr);
            tdManage.appendChild(document.createTextNode(' '));
            tdManage.appendChild(linkBtn);
            tdManage.appendChild(document.createTextNode(' '));
            tdManage.appendChild(moneyBtn);
          }

          tr.appendChild(tdCode);
          tr.appendChild(tdPct);
          tr.appendChild(tdPartner);
          tr.appendChild(tdUntil);
          tr.appendChild(tdStatus);
          tr.appendChild(tdUses);
          tr.appendChild(tdManage);
          tb.appendChild(tr);
        }
        table.appendChild(tb);
        content.innerHTML = '';
        content.appendChild(table);
      }

      async function apiToggle(id, active) {
        try {
          const r = await fetch(withKey('/api/admin/coupons/' + id), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active }),
          });
          return r.ok;
        } catch {
          return false;
        }
      }

      async function apiDelete(id) {
        try {
          const r = await fetch(withKey('/api/admin/coupons/' + id), { method: 'DELETE' });
          return r.ok;
        } catch {
          return false;
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.textContent = '';
        const code = codeEl.value.trim();
        const pct = Number(pctEl.value);
        const until = untilEl.value; // '' or 'YYYY-MM-DD'
        submitBtn.disabled = true;
        try {
          const r = await fetch(withKey('/api/admin/coupons'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              code,
              discount_pct: pct,
              valid_until: until || null,
              partner_name: partnerEl.value.trim(),
              commission_type: ctypeEl.value || null,
              commission_value: Number(cvalueEl.value) || 0,
            }),
          });
          if (r.ok) {
            form.reset();
            load();
          } else {
            let msg = 'לא ניתן ליצור את הקופון.';
            try {
              const data = await r.json();
              if (data && data.error) msg = ERR_HE[data.error] || data.error;
            } catch {
              /* keep default */
            }
            errEl.textContent = msg;
          }
        } catch {
          errEl.textContent = 'שגיאה בשליחה.';
        } finally {
          submitBtn.disabled = false;
        }
      });

      async function load() {
        if (!key) {
          sub.textContent = '';
          createPanel.hidden = true;
          content.innerHTML =
            '<div class="msg">חסר מפתח גישה. פתחו עם <code>?key=…</code> בכתובת.</div>';
          return;
        }
        try {
          const r = await fetch('/api/admin/coupons?key=' + encodeURIComponent(key));
          if (r.status === 403) {
            sub.textContent = '';
            createPanel.hidden = true;
            content.innerHTML = '<div class="msg">מפתח גישה שגוי.</div>';
            return;
          }
          const coupons = (await r.json()).coupons || [];
          sub.textContent = coupons.length + ' קופונים';
          createPanel.hidden = false;
          render(coupons);
        } catch {
          sub.textContent = '';
          content.innerHTML = '<div class="msg">שגיאה בטעינה.</div>';
        }
      }
      load();
    </script>
  </body>
</html>
