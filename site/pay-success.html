<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="dugri:page" content="pay-success.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>דוגרי · התשלום התקבל</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <link
      rel="stylesheet"
      href="/assets/fonts/fonts.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript><link rel="stylesheet" href="/assets/fonts/fonts.css" /></noscript>
    <link rel="stylesheet" href="/css/tokens.css" />
    <style>
      body {
        margin: 0;
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 32px 20px calc(40px + env(safe-area-inset-bottom, 0px));
      }
      .done {
        width: 100%;
        max-width: 480px;
        text-align: center;
      }
      /* The confirmation mark: a solid black disc with a white check that draws
         itself in. It's the first thing on screen and the whole point of the
         page — "the payment went through" has to be readable in one glance. */
      .mark {
        width: 108px;
        height: 108px;
        margin: 0 auto 26px;
        border-radius: 50%;
        background: var(--ink);
        display: grid;
        place-items: center;
        animation: markIn 0.45s var(--ease) both;
      }
      .mark svg {
        width: 56px;
        height: 56px;
      }
      .mark path {
        fill: none;
        stroke: #fff;
        stroke-width: 7;
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        animation: checkDraw 0.5s var(--ease) 0.22s forwards;
      }
      @keyframes markIn {
        from {
          opacity: 0;
          transform: scale(0.7);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes checkDraw {
        to {
          stroke-dashoffset: 0;
        }
      }
      /* No motion for users who ask for none — the check is simply there. */
      @media (prefers-reduced-motion: reduce) {
        .mark,
        .mark path {
          animation: none;
        }
        .mark path {
          stroke-dashoffset: 0;
        }
      }
      h1 {
        font-family: var(--display);
        font-weight: var(--h-weight);
        letter-spacing: var(--h-spacing);
        font-size: clamp(28px, 7vw, 38px);
        margin: 0 0 14px;
      }
      .lead {
        font-size: 17px;
        line-height: 1.65;
        color: var(--muted);
        margin: 0 auto 22px;
        max-width: 30em;
      }
      /* The order number, as its own object rather than a line of copy — it is
         the one string the buyer may have to quote back at us, so it gets the
         weight of a reference and a one-tap copy. */
      .orderno {
        display: none;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-sizing: border-box;
        border: 1px solid var(--line);
        background: var(--section);
        padding: 11px 14px;
        margin: 0 0 22px;
        font: inherit;
        color: var(--ink);
        cursor: pointer;
        text-align: center;
      }
      .orderno.shown {
        display: flex;
      }
      .orderno .lbl {
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .orderno .val {
        font-weight: 900;
        font-size: 17px;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }
      .orderno .copied {
        font-size: 12px;
        font-weight: 700;
        color: var(--ok);
      }
      /* What they just bought. The picture is the buyer's OWN card — rendered
         from the same inputs the wizard previewed — so the confirmation shows the
         thing they paid for, not a stock photo of the product line. */
      .summary {
        display: none;
        border: 1px solid var(--line);
        text-align: start;
        margin: 0 0 26px;
      }
      .summary.shown {
        display: block;
      }
      .summary h2 {
        margin: 0;
        padding: 13px 16px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      .shot {
        margin: 0;
        background: var(--section);
        min-height: 150px;
        display: grid;
        place-items: center;
        border-bottom: 1px solid var(--line);
        overflow: hidden;
      }
      .shot img {
        display: block;
        max-width: 100%;
        max-height: 300px;
        opacity: 0;
        transition: opacity 0.35s var(--ease);
      }
      .shot img.loaded {
        opacity: 1;
      }
      /* Shown until the first image lands, so the block never opens as a hole. */
      .shot .skel {
        font-size: 13px;
        color: var(--muted);
        padding: 24px;
      }
      .rows p {
        display: flex;
        gap: 12px;
        align-items: baseline;
        justify-content: space-between;
        margin: 0;
        padding: 12px 16px;
        font-size: 15px;
        line-height: 1.5;
      }
      .rows p + p {
        border-top: 1px solid var(--line);
      }
      .rows .k {
        color: var(--muted);
        font-size: 13.5px;
        flex: none;
      }
      .rows .v {
        font-weight: 700;
        text-align: end;
      }
      .rows .desc {
        display: block;
        color: var(--muted);
        font-size: 13.5px;
        font-weight: 400;
        padding-top: 3px;
      }
      /* The two facts the buyer wants confirmed, as a bordered receipt block so
         they read as a record of what just happened, not as body copy. */
      .facts {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        text-align: start;
        margin: 0 0 28px;
      }
      .facts p {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin: 0;
        padding: 14px 16px;
        font-size: 15px;
        line-height: 1.55;
      }
      .facts p + p {
        border-top: 1px solid var(--line);
      }
      .facts b {
        font-weight: 800;
      }
      .facts i {
        font-style: normal;
        flex: none;
      }
      .back {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 18px 20px;
        border: none;
        border-radius: var(--radius-pill);
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-weight: 900;
        font-size: 18px;
        letter-spacing: 0.2px;
        text-decoration: none;
        cursor: pointer;
        box-shadow: var(--shadow-md);
        transition:
          background 0.2s var(--ease),
          transform 0.12s var(--ease);
      }
      .back:hover {
        background: #000;
        transform: translateY(-2px);
      }
      .back:active {
        transform: translateY(0);
      }
      /* Secondary route out: a direct line to us, with the order number already
         in the message so we know which order they mean. */
      .wa {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
        box-sizing: border-box;
        margin-top: 12px;
        padding: 15px 20px;
        border: 1px solid var(--ink);
        border-radius: var(--radius-pill);
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-weight: 800;
        font-size: 16px;
        text-decoration: none;
        transition:
          background 0.2s var(--ease),
          color 0.2s var(--ease);
      }
      .wa:hover {
        background: var(--ink);
        color: #fff;
      }
      .wa svg {
        width: 20px;
        height: 20px;
        flex: none;
      }
    </style>
    <script src="js/editor.js" defer></script>
  </head>
  <body>
    <main class="done">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" role="presentation">
          <path d="M15 33 L27 45 L49 21" />
        </svg>
      </div>
      <h1 data-edit="paysuccess-title">התשלום התקבל</h1>
      <p class="lead" data-edit="paysuccess-lead">
        תודה רבה על ההזמנה! זהו, ההזמנה שלכם נקלטה אצלנו.
      </p>

      <button class="orderno" id="orderNo" type="button" hidden>
        <span class="lbl" data-edit="paysuccess-orderno-label">מספר הזמנה</span>
        <span class="val" id="orderNoVal"></span>
        <span class="copied" id="orderNoCopied" hidden>הועתק ✓</span>
      </button>

      <section class="summary" id="summary" aria-live="polite">
        <h2 data-edit="paysuccess-summary-title">מה הזמנתם</h2>
        <figure class="shot" id="shot">
          <span class="skel" id="shotSkel" data-edit="paysuccess-shot-loading"
            >מכינים תצוגה מקדימה של הקלף שלכם…</span
          >
          <img id="shotImg" alt="" hidden />
        </figure>
        <div class="rows" id="summaryRows"></div>
      </section>

      <div class="facts">
        <p>
          <i aria-hidden="true">✉️</i>
          <span data-edit="paysuccess-fact-mail"
            ><b>אישור בדרך למייל.</b> אם הוא לא הגיע תוך כמה דקות, שווה להציץ גם בספאם.</span
          >
        </p>
        <p>
          <i aria-hidden="true">✍️</i>
          <span data-edit="paysuccess-fact-words"
            ><b>אפשר להמשיך להוסיף מילים.</b> האיסוף נשאר פתוח עד שתלחצו ‘מספיק! סיימנו’ - ורק אז
            נתחיל להפיק.</span
          >
        </p>
      </div>
      <a class="back" id="backBtn" href="/" data-edit="paysuccess-back">חזרה להוספת מילים</a>
      <a class="wa" id="waBtn" href="https://wa.me/972546577715" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.14.17-.24.25-.41.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43-.14-.01-.31-.01-.48-.01a.92.92 0 0 0-.67.31c-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.02 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"
          />
        </svg>
        <span data-edit="paysuccess-wa">שאלה? דברו איתנו בוואטסאפ</span>
      </a>
    </main>
    <script>
      // Where to send the buyer back to: the collect page they paid from.
      // Sources, in order — an explicit ?back= (set by collect.html when it
      // redirects here), then the URL stashed in sessionStorage before the
      // payment window opened (covers a top-level PeleCard redirect, where no
      // query survives). Only same-origin ABSOLUTE PATHS are accepted, so a
      // crafted ?back= can't turn this page into an open redirect.
      (function () {
        function safePath(v) {
          return typeof v === 'string' && /^\/[^/\\]/.test(v) ? v : null;
        }
        var own = new URLSearchParams(location.search);
        var back = safePath(own.get('back'));
        if (!back) {
          try {
            var stored = sessionStorage.getItem('dugri:payReturn');
            back = safePath(stored);
          } catch (e) {
            /* private mode / storage disabled — fall through to the default */
          }
        }
        if (back) document.getElementById('backBtn').href = back;

        // The collect URL we just came from carries the collection id and the
        // owner token (?c=…&k=…) — the two things the order summary needs. Read
        // them from our OWN query first (an explicit hand-off), else parse the
        // return path. Without both we simply show no summary: the page still
        // confirms the payment and still points back to adding words.
        function fromQuery(qs) {
          var p = new URLSearchParams(qs || '');
          var c = p.get('c');
          var k = p.get('k');
          return c && k ? { c: c, k: k } : null;
        }
        var ref = fromQuery(location.search);
        if (!ref && back) ref = fromQuery(back.split('?')[1] || '');
        if (!ref) return;

        var waBtn = document.getElementById('waBtn');
        var WA_NUMBER = '972546577715';

        function show(el) {
          el.hidden = false;
          el.classList.add('shown');
        }

        function row(key, value, description) {
          var p = document.createElement('p');
          var k = document.createElement('span');
          k.className = 'k';
          k.textContent = key;
          var v = document.createElement('span');
          v.className = 'v';
          v.textContent = value;
          if (description) {
            var d = document.createElement('span');
            d.className = 'desc';
            d.textContent = description;
            v.appendChild(d);
          }
          p.appendChild(k);
          p.appendChild(v);
          return p;
        }

        // The amount to print: what was actually CHARGED when we know it (a
        // coupon means that is not the package price), else the package price.
        // A 0 charge is a real, fully-discounted order — not a missing value.
        function amountText(order) {
          var n = order.charged != null ? order.charged : order.total;
          if (n == null) return null;
          if (n <= 0) return 'חינם (קופון 100%)';
          return n + ' ₪';
        }

        fetch(
          '/api/collections/' +
            encodeURIComponent(ref.c) +
            '/summary?k=' +
            encodeURIComponent(ref.k)
        )
          .then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          })
          .then(function (s) {
            if (s.order_no) {
              var btn = document.getElementById('orderNo');
              var val = document.getElementById('orderNoVal');
              var copied = document.getElementById('orderNoCopied');
              val.textContent = s.order_no;
              show(btn);
              btn.addEventListener('click', function () {
                navigator.clipboard.writeText(s.order_no).then(function () {
                  copied.hidden = false;
                  setTimeout(function () {
                    copied.hidden = true;
                  }, 1600);
                });
              });
              // Give us the order number up front so a question doesn't start
              // with us asking "which order?".
              waBtn.href =
                'https://wa.me/' +
                WA_NUMBER +
                '?text=' +
                encodeURIComponent('היי, יש לי שאלה על הזמנה ' + s.order_no);
            }

            var rows = document.getElementById('summaryRows');
            if (s.order) {
              rows.appendChild(row('חבילה', s.order.version_label, s.order.description));
              var amount = amountText(s.order);
              if (amount) rows.appendChild(row(s.order.paid ? 'שולם' : 'מחיר', amount));
            }
            if (s.honoree_name) rows.appendChild(row('לכבוד', s.honoree_name));
            if (s.design) rows.appendChild(row('עיצוב', s.design));
            if (s.color) rows.appendChild(row('צבע', s.color));
            if (!rows.children.length && !s.product_image && !s.preview) return;
            show(document.getElementById('summary'));

            var img = document.getElementById('shotImg');
            var skel = document.getElementById('shotSkel');
            function paint(src, alt) {
              img.onload = function () {
                skel.hidden = true;
                img.hidden = false;
                img.classList.add('loaded');
              };
              img.alt = alt || '';
              img.src = src;
            }
            // Show the catalogue photo of the chosen design at once so the block
            // is never empty, then swap in the buyer's OWN rendered card when it
            // arrives. The wizard already rendered these exact inputs, so this is
            // normally a preview-cache hit and the swap is immediate.
            if (s.product_image) paint(s.product_image, s.design || '');
            if (!s.preview) {
              if (!s.product_image) skel.textContent = '';
              return;
            }
            fetch('/api/preview', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(s.preview),
            })
              .then(function (r) {
                if (!r.ok) throw new Error(r.status);
                return r.json();
              })
              .then(function (p) {
                if (p && p.card) paint(p.card, s.honoree_name || '');
                else if (!s.product_image) skel.hidden = true;
              })
              .catch(function () {
                // The render failed or timed out — the catalogue photo (when we
                // have one) already stands in; otherwise drop the empty frame.
                if (!s.product_image) {
                  document.getElementById('shot').style.display = 'none';
                }
              });
          })
          .catch(function () {
            /* No summary (expired link, wrong token, server hiccup) — the
               confirmation itself still stands on its own. */
          });
      })();
    </script>
  </body>
</html>
