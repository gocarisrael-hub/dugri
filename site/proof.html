<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="dugri:page" content="proof.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>דוגרי · הגהת החפיסה</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="stylesheet"
      href="/assets/fonts/fonts.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript><link rel="stylesheet" href="/assets/fonts/fonts.css" /></noscript>
    <link rel="stylesheet" href="/css/tokens.css" />
    <style>
      :root {
        --paper: #faf9f7;
        --card: #ffffff;
        --ink: #141413;
        --muted: #6b6a66;
        --faint: #96948e;
        --rule: #e4e1db;
        --rule2: #cfcbc3;
        --slab: #141413;
        --slabink: #ffffff;
        --ui: 'Heebo', system-ui, 'Segoe UI', Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 400 16px/1.6 var(--ui);
        padding: 0 1.1rem 6.5rem;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
      }
      header.top {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--paper);
        border-bottom: 1px solid var(--rule);
        padding: 1.1rem 0 0.8rem;
        margin-bottom: 1.2rem;
      }
      .eyebrow {
        font: 500 11px/1 var(--ui);
        letter-spacing: 0.14em;
        color: var(--faint);
        margin: 0 0 0.5rem;
      }
      h1 {
        font: 200 clamp(26px, 4.4vw, 40px) / 1.15 var(--ui);
        margin: 0 0 0.35rem;
        text-wrap: balance;
      }
      .lede {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        max-width: 62ch;
      }
      h2.sec {
        font: 300 22px var(--ui);
        margin: 2.6rem 0 0.3rem;
      }
      p.sub {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 14.5px;
      }
      /* The grid. A card is the PDF page, at the page's own proportions. */
      .sheet {
        display: grid;
        gap: 0.85rem;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      .card {
        position: relative;
        margin: 0;
        background: var(--card);
        border: 1px solid var(--rule);
        aspect-ratio: 223.92/312;
        overflow: hidden;
        cursor: zoom-in;
        transition: border-color 0.12s;
      }
      .card:hover,
      .card:focus-visible {
        border-color: var(--rule2);
        outline: none;
      }
      .card:focus-visible {
        box-shadow: 0 0 0 2px var(--ink);
      }
      .card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      /* One card, large. A WIDTH, not just a max-width: a dialog sizes to its
         content, and a stage with only an aspect-ratio collapses to nothing. */
      dialog {
        border: none;
        padding: 0;
        background: transparent;
        width: min(92vw, 440px);
        max-width: none;
      }
      dialog::backdrop {
        background: rgba(20, 20, 19, 0.72);
      }
      .big {
        background: var(--card);
        border: 1px solid var(--rule2);
      }
      .big .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 223.92/312;
        overflow: hidden;
      }
      .big .stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .big .row {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid var(--rule);
      }
      .btn {
        font: 500 14px var(--ui);
        padding: 0.55rem 0.95rem;
        border: 1px solid var(--rule2);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--ink);
      }
      .btn.solid {
        background: var(--slab);
        color: var(--slabink);
        border-color: var(--slab);
      }
      .wa {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        background: #25d366;
        color: #0b3d24;
        border: none;
        padding: 0.62rem 0.95rem;
        font: 500 14px var(--ui);
        text-decoration: none;
      }
      .state {
        color: var(--muted);
        font-size: 15px;
        padding: 2rem 0;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --paper: #131311;
          --card: #1c1b19;
          --ink: #eceae4;
          --muted: #a3a09a;
          --faint: #78756f;
          --rule: #2b2a27;
          --rule2: #3a3835;
          --slab: #eceae4;
          --slabink: #141413;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <p class="eyebrow">לפני שליחה לייצור</p>
        <h1>הגהת החפיסה</h1>
        <p class="lede">כל מה שיוצא לדפוס, כפי שיצא. אלה העמודים מתוך הקובץ עצמו — לא ציור שלהם.</p>
      </header>

      <div id="state" class="state">טוען את החפיסה…</div>

      <section id="deck" hidden>
        <h2 class="sec">קלפי המשחק</h2>
        <p class="sub">לחצי על קלף כדי לראות אותו גדול.</p>
        <div class="sheet" id="sheet"></div>
      </section>

      <section id="help" hidden style="margin-top: 2.6rem">
        <h2 class="sec">משהו לא נראה נכון?</h2>
        <p class="sub">כתבי לנו ונתקן לפני שזה יוצא לדפוס.</p>
        <a class="wa" id="wa" href="#" target="_blank" rel="noopener">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.2 1.3-1.9 1.4-.5.1-1.1.1-1.8-.1a14 14 0 0 1-6.6-5.7c-.5-.8-.8-1.7-.8-2.5 0-.9.5-1.6 1-1.9.2-.2.5-.2.7-.2h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2 0 .4-.1.5l-.4.5c-.1.2-.3.3-.1.6.5.9 1.2 1.6 2.1 2.2.3.2.5.1.6 0l.6-.7c.2-.2.3-.2.6-.1l1.8.9c.2.1.4.2.4.4 0 .1 0 .8-.2 1.3Z"
            />
          </svg>
          שליחת הודעה בוואטסאפ
        </a>
      </section>
    </div>

    <dialog id="big">
      <div class="big">
        <div class="stage"><img id="bigImg" alt="" /></div>
        <div class="row">
          <button class="btn" id="prev" type="button">הקודם</button>
          <button class="btn" id="next" type="button">הבא</button>
          <button class="btn solid" id="close" type="button" style="margin-inline-start: auto">
            סגירה
          </button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/js/proof.js"></script>
  </body>
</html>
