<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="dugri:page" content="pay-done.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>דוגרי · תשלום</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#8ca287" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="דוגרי" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link
      rel="stylesheet"
      href="/assets/fonts/fonts.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript><link rel="stylesheet" href="/assets/fonts/fonts.css" /></noscript>
    <link rel="stylesheet" href="/css/tokens.css" />
    <style>
      body {
        margin: 0;
        font-family: var(--font);
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        text-align: center;
        padding: 24px;
      }
      .msg {
        font-size: 18px;
        font-weight: 700;
        font-family: var(--display);
      }
      .msg.ok {
        color: var(--sage-deep);
      }
      .msg.err {
        color: #a85a4f; /* deep blush — readable failure state */
      }
      .sub {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      .back {
        display: none;
        margin-top: 18px;
        color: var(--ink);
        font-weight: 800;
        font-size: 15px;
      }
    </style>
    <script src="js/editor.js" defer></script>
  </head>
  <body>
    <div>
      <div class="msg" id="msg">מעבדים את התשלום…</div>
      <div class="sub" id="sub">רגע אחד</div>
      <a class="back" id="back" href="/">חזרה להוספת מילים</a>
    </div>
    <script>
      // This page is loaded by PeleCard when the transaction completes (its
      // GoodURL/ErrorURL). Normally that happens inside our payment iframe, so
      // we just tell the parent collect.html how it went and it takes over. If
      // it ever lands at the TOP level instead, there is no parent to hand off
      // to — so drive the buyer onward from here rather than dead-ending on a
      // bare status line.
      (function () {
        var params = new URLSearchParams(location.search);
        var ok = !params.has('error');
        var msgEl = document.getElementById('msg');
        msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
        msgEl.textContent = ok ? 'התשלום התקבל ✓' : 'התשלום לא הושלם';
        document.getElementById('sub').textContent = ok ? 'מעבירים אתכם בחזרה…' : 'אפשר לנסות שוב';
        var inFrame = false;
        try {
          inFrame = !!window.parent && window.parent !== window;
          if (inFrame) window.parent.postMessage({ type: 'dugri-pay', ok: ok }, location.origin);
        } catch (e) {
          /* no-op */
        }
        if (inFrame) return;
        if (ok) {
          location.replace('pay-success.html');
          return;
        }
        // Failed, top level: offer the way back to the collection they paid
        // from. Only a same-origin absolute path is accepted.
        try {
          var back = sessionStorage.getItem('dugri:payReturn');
          if (back && /^\/[^/\\]/.test(back)) {
            var a = document.getElementById('back');
            a.href = back;
            a.textContent = 'חזרה לאיסוף המילים';
            a.style.display = 'inline-block';
          }
        } catch (e) {
          /* storage disabled — the status line still explains what happened */
        }
      })();
    </script>
  </body>
</html>
