    <style>
      body {
        margin: 0;
        font-family: var(--font);
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        text-align: center;
        padding: 24px;
      }
      .msg {
        font-size: 18px;
        font-weight: 700;
        font-family: var(--display);
      }
      .msg.ok {
        color: var(--sage-deep);
      }
      .msg.err {
        color: #a85a4f; /* deep blush — readable failure state */
      }
      .sub {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      .back {
        display: none;
        margin-top: 18px;
        color: var(--ink);
        font-weight: 800;
        font-size: 15px;
      }
      /* A failure at the top level, where there is no checkout behind the page: the logo and the two ways on (home, and
         a person on WhatsApp), so the page is never a dead end. Hidden in the payment window, which hands off at once. */
      .logo {
        display: block;
        width: 64px;
        margin: 0 auto 18px;
      }
      .logo img {
        display: block;
        width: 64px;
        height: 64px;
      }
      .away {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
      }
      .logo[hidden],
      .away[hidden] {
        display: none;
      }
      .away a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        border: 1px solid var(--ink);
        border-radius: var(--radius-pill);
        color: var(--ink);
        font-weight: 800;
        font-size: 15px;
        text-decoration: none;
      }
      .away svg {
        width: 20px;
        height: 20px;
        flex: none;
      }
    </style>
    <script src="js/editor.js" defer></script>

  <body>
    <div>

      <div class="sub" id="sub">רגע אחד</div>
      <a class="back" id="back" href="/">חזרה להוספת מילים</a>
      <div class="away" id="away" hidden>
        <a class="home" id="homeLink" href="/" data-edit="paydone-home">לדף הבית</a>
        <a
          class="wa"
          id="waLink"
          href="https://wa.me/972552441334?text=%D7%94%D7%99%D7%99%2C%20%D7%94%D7%AA%D7%A9%D7%9C%D7%95%D7%9D%20%D7%A9%D7%9C%D7%99%20%D7%9C%D7%90%20%D7%94%D7%95%D7%A9%D7%9C%D7%9D"
          target="_blank"
          rel="noopener"
        >

              fill="currentColor"
              d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.14.17-.24.25-.41.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43-.14-.01-.31-.01-.48-.01a.92.92 0 0 0-.67.31c-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.02 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"
            />

          <span data-edit="paydone-wa">שאלה? דברו איתנו בוואטסאפ</span>
        </a>
      </div>
    </div>
    <script>
      // This page is loaded by PeleCard when the transaction completes (its
      // GoodURL/ErrorURL). Normally that happens inside our payment iframe, so
      // we just tell the parent collect.html how it went and it takes over. If
      // it ever lands at the TOP level instead, there is no parent to hand off
      // to — so drive the buyer onward from here rather than dead-ending on a
      // bare status line.
      (function () {
        var params = new URLSearchParams(location.search);
        var ok = !params.has('error');
        var msgEl = document.getElementById('msg');
        msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
        msgEl.textContent = ok ? 'התשלום התקבל ✓' : 'התשלום לא הושלם';
        document.getElementById('sub').textContent = ok ? 'מעבירים אתכם בחזרה…' : 'אפשר לנסות שוב';
        var inFrame = false;
        try {
          inFrame = !!window.parent && window.parent !== window;
          // TARGETED AT '*', DELIBERATELY. PeleCard returns here at the address
          // in PUBLIC_BASE_URL, which is not necessarily the address the buyer
          // is browsing — and when the two differ, naming our OWN origin as the
          // target means the browser silently refuses to deliver. That failure
          // has no error and no symptom on this side: the buyer pays, this page
          // says "returning you…", and the checkout behind it never hears.
          //
          // '*' is safe for THIS message and only this one: it carries a type
          // and a boolean, no order id, no token, no amount. A page that
          // embedded us would learn that a payment inside its own frame
          // finished, which it already knows. The receiving side does the real
          // check — it verifies the message came from the window it opened
          // (e.source), which no third party can forge.
          if (inFrame) window.parent.postMessage({ type: 'dugri-pay', ok: ok }, '*');
        } catch (e) {
          /* no-op */
        }
        if (inFrame) return;
        if (ok) {
          location.replace('pay-success.html');
          return;
        }
        // Failed, top level: there is no checkout behind this page, so it must
        // not be a dead end. The logo, home and WhatsApp always; and first, the
        // way back to the collection they paid from, when one was stored.
        document.getElementById('logo').hidden = false;
        document.getElementById('away').hidden = false;
        // Only a same-origin absolute path is accepted.
        try {
          var back = sessionStorage.getItem('dugri:payReturn');
          if (back && /^\/[^/\\]/.test(back)) {
            var a = document.getElementById('back');
            a.href = back;
            a.textContent = 'חזרה לאיסוף המילים';
            a.style.display = 'inline-block';
          }
        } catch (e) {
          /* storage disabled — the status line still explains what happened */
        }
      })();
    </script>
  </body>
