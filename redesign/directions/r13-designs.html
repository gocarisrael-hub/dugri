<!doctype html>

<title>דוגרי · r13 · כל העיצובים בהקשה</title>
<!-- FONTLINK:START -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;800;900&display=swap" rel="stylesheet" />
<!-- FONTLINK:END -->
<style>
  /* FONT:START (the only block that differs between r7-a and r7-b) */
  :root {
    --display: 'Rubik', system-ui, sans-serif;  /* headings, stickers, pills */
    --body: 'Rubik', system-ui, sans-serif;     /* running text */
    --h-weight: 900; --h-track: -.01em;         /* headings */
    --b-weight: 800;                            /* stickers, pills, labels */
    --pitch-weight: 500;
  }
  /* r13: #font=N sets --display / --body / weights inline on <html> (FONTS below); a chosen font never fakes a weight it does not have */
  html.fsel, html.fsel * { font-synthesis: none; }
  /* the two condensed faces are drawn much smaller on the same size: their display text is scaled to Rubik's letter height */
  html.f-tall :is(h1, h2, h3, .catch .q, .catch .big, .pill, .sticker, .hint, .rc .ttl, .rc .tag, .nm, .lede) { font-size-adjust: cap-height .9; }
  html.f-tall .pn.pink { font-family: var(--body); font-size-adjust: none; }
  html.f-accent h1, html.f-accent h2, html.f-accent .flood h3, html.f-accent .catch .big { font-family: 'Gveret', 'Rubik', sans-serif !important; font-weight: 400 !important; }
  /* FONT:END */

  /* TITLES (#title=1..10 -> html.t-N): the hero headline and the four section titles (.tt), each with a palette colour (--c) and a key word (.kw).
     Only the palette (#ffd37b, #a4e9ff, #ff7aa9, the logo pink #ea4795, ink, #fff1de); a colour that carries text alone is darkened to AA large */
  .tt { --c: var(--pink); --cd: #ad003d; --kick: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-2 -2 44 44'><path d='M20 2c1.6 9.6 8.4 16.4 18 18-9.6 1.6-16.4 8.4-18 18-1.6-9.6-8.4-16.4-18-18 9.6-1.6 16.4-8.4 18-18Z' fill='%23ff7aa9' stroke='%23000' stroke-width='2.6' stroke-linejoin='round'/></svg>"); }
  .tt.tc-y { --c: var(--yel); --cd: #764f00; --kick: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-2 -2 44 44'><path d='M20 2c1.6 9.6 8.4 16.4 18 18-9.6 1.6-16.4 8.4-18 18-1.6-9.6-8.4-16.4-18-18 9.6-1.6 16.4-8.4 18-18Z' fill='%23ffd37b' stroke='%23000' stroke-width='2.6' stroke-linejoin='round'/></svg>"); }
  .tt.tc-s { --c: var(--sky); --cd: #005d7b; --kick: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-2 -2 44 44'><path d='M20 2c1.6 9.6 8.4 16.4 18 18-9.6 1.6-16.4 8.4-18 18-1.6-9.6-8.4-16.4-18-18 9.6-1.6 16.4-8.4 18-18Z' fill='%23a4e9ff' stroke='%23000' stroke-width='2.6' stroke-linejoin='round'/></svg>"); }
  /* 2: ink, with a soft pink offset */
  html.t-2 .tt { text-shadow: .04em .04em 0 var(--pink); }
  /* 3: the headline in the logo pink (3.2:1 on the page: AA for large text); the section titles ink */
  html.t-3 #h1 { color: #ea4795; }
  /* 4: the key word in its colour, outlined in ink, like the leaflet's coloured words */
  html.t-4 .tt .kw { color: var(--c); -webkit-text-stroke: .07em var(--ink); paint-order: stroke fill; }
  /* 5: a yellow marker band behind the key word, with a hand-drawn edge */
  html.t-5 .tt .kw { background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 40' preserveAspectRatio='none'><path d='M5 10 C40 5 90 8 140 6 S188 7 196 9 L194 31 C150 35 100 31 60 33 S14 33 4 31 Z' fill='%23ffd37b'/></svg>") no-repeat 0 82% / 100% 50%; padding-inline: .06em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  /* 6: the headline as the leaflet's title: an ink outline, a page-coloured fill and a pink offset; the section titles solid */
  html.t-6 #h1 { color: var(--page); -webkit-text-stroke: .055em var(--ink); paint-order: stroke fill; text-shadow: .05em .05em 0 var(--pink); letter-spacing: .015em; }
  /* 7: a hand-drawn squiggle under the key word, in the logo pink */
  html.t-7 .tt .kw { position: relative; display: inline-block; }
  html.t-7 .tt .kw::after { content: ''; position: absolute; inset-inline: 0; bottom: -.14em; height: .16em; background: #ea4795; -webkit-mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 10'><path d='M0 6 Q5 1 10 5 T20 5 T30 5 T40 5' fill='none' stroke='%23000' stroke-width='2.6' stroke-linecap='round'/></svg>") repeat-x 0 50% / .62em 100%; mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 10'><path d='M0 6 Q5 1 10 5 T20 5 T30 5 T40 5' fill='none' stroke='%23000' stroke-width='2.6' stroke-linecap='round'/></svg>") repeat-x 0 50% / .62em 100%; }
  /* 8: each title in its own colour, darkened to AA for large text (6.5:1 on the page; 3.2:1 even at the designs panel's palest top) */
  html.t-8 .tt { color: var(--cd); }
  /* 9: a small star before each title, in its colour with an ink line; the title stays ink */
  html.t-9 .tt::before { content: ''; display: inline-block; width: .4em; height: .4em; margin-inline-end: .14em; vertical-align: .1em; background: var(--kick) center / contain no-repeat; }
  /* 10: a deep plum ink instead of black, for every title */
  html.t-10 .tt { color: #2b1a33; }

  /* the title switch (while testing), above the font chooser */
  .fab.tsw { inset-inline-start: max(16px, env(safe-area-inset-right)); bottom: calc(max(16px, env(safe-area-inset-bottom) + 10px) + var(--pal-h, 0px) + 50px); display: flex; align-items: center; background: #fff; border: 1.5px dashed var(--ink); border-radius: 999px; font: 600 13px/1 system-ui, sans-serif; }
  .tsw { opacity: .92; }
  .tsw > button { border: 0; background: none; color: var(--ink); font: inherit; min-height: 40px; padding: 0 10px; cursor: pointer; }
  .tsw > button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .tsw #tName { padding: 0 2px; white-space: nowrap; }
  body:has(.fsw.open) .tsw { opacity: 0; visibility: hidden; }

  /* THEME: the Dugri colours on the live site's sand (tokens.css --section) as the page ground */
  :root {
    --page: #fff1de;      /* the owner's page colour (r11); the page flows on it with no section breaks */
    /* the hero's three colours (the owner's, r12), in the leaflet's treatment: dark text on the fills, and any text set in a colour is large and outlined in ink */
    --yel: #ffd37b;
    --sky: #a4e9ff;
    --pink: #ff7aa9;
    --tile: #ffffff;
    --sticker-hot: #ea4795; /* the pink of the logo, sampled from logo-pink-original.png */
    --spark: #ea4795;
    --ink: #000;
    --paper: #fff;
    --line: 3px;
    --sh: 4px 4px 0 var(--ink);       /* hard offset shadow, bottom-right everywhere (r11: the same fall as the review cards) */
    --sh-sm: 3px 3px 0 var(--ink);
    --rad: 6% / 4.26%;                /* the preview's card shape (.design-preview/outline-rules.txt): one corner and one 1.5 px border for every card */
    --cw: min(32vw, 150px);
  }
  @font-face { font-family: 'Gveret'; src: url(../../site/assets/fonts/gveret-levin-400-hebrew.8c865542.woff2) format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; font-display: swap; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; overflow-x: clip; }
  body { background: var(--page); color: var(--ink); font: 400 17px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
  img { display: block; max-width: 100%; user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

  /* the shared language: outlines, stickers, pills, sparkles */
  /* labels: calm, flat, upright; a thin outline and nothing else */
  .sticker { display: inline-block; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 999px; padding: 5px 12px 6px; font: 700 13px/1.1 var(--display); letter-spacing: .02em; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--ink); color: #fff; text-decoration: none; border: 0; border-radius: 999px; font: var(--b-weight) 16px/1 var(--display); letter-spacing: .02em; padding: 16px 26px; cursor: pointer; transition: transform .15s cubic-bezier(.3, 1.4, .5, 1); }
  .pill:active { transform: scale(.96); }
  /* the forward arrow: drawn, not a glyph, so it is the same in every font; its line follows the button type's weight (--arr-sw) */
  .arr { width: 1.1em; height: 1.1em; flex: none; fill: none; stroke: currentColor; stroke-width: var(--arr-sw, 2.9); stroke-linecap: round; stroke-linejoin: round; }
  body.no-arrow .arr { display: none; }
  .pill:has(.arr) { gap: 8px; }
  .tok { display: inline-block; background: var(--paper); border: 2px dashed var(--ink); padding: 0 6px; font-weight: 800; direction: ltr; unicode-bidi: isolate; letter-spacing: 0; }
  .pill .tok { background: transparent; border-color: #fff; color: #fff; }
  .spark { position: absolute; width: var(--s, 34px); height: var(--s, 34px); pointer-events: none; fill: var(--spark); stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; overflow: visible; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; }

  section { position: relative; padding: 44px 16px 52px; overflow: clip; } /* no rule, no fill: the page just flows */
  h1, h2 { font-family: var(--display); font-weight: var(--h-weight); margin: 0; line-height: 1; letter-spacing: var(--h-track); }
  h2 { font-size: clamp(32px, 9vw, 58px); }
  .lede { font-size: 17px; margin: 12px 0 0; max-width: 34ch; }

  /* header */
  header { display: flex; align-items: center; justify-content: space-between; padding: max(10px, env(safe-area-inset-top)) 16px 0; }
  header .logo { width: 86px; height: auto; margin: -6px 0 -10px 0; }
  header .pill { padding: 12px 18px; font-size: 14px; }

  /* hero: the deck, then her whole "מה זה דוגרי?" text, set the way the printed leaflet sets "על המשחק":
     a sky-blue panel with pink lettering, the mustard title with a pink outline and offset, a pink panel with light lettering */
  .hero { padding-top: 4px; padding-bottom: 40px; }
  .hero-in { display: grid; gap: 0; }
  .hero-text { position: relative; }
  .hero h1 { margin: 6px 0 0; font: 900 clamp(38px, 11vw, 76px)/.98 var(--display); letter-spacing: -.02em; max-width: 12ch; text-wrap: balance; }
  .pn { margin: 16px 0 0; border-radius: 26px; padding: 20px 24px 22px; font: 500 17px/1.55 var(--body); max-width: 560px; }
  .pn.sky { background: var(--sky); }
  .pn.sky b { font-weight: 800; }
  .catch { margin: 22px 0 0; }
  .catch .q { display: block; font: 800 21px/1 var(--display); }
  .catch .big { display: block; margin-top: 8px; font: 900 clamp(32px, 8.6vw, 54px)/1.05 var(--display); letter-spacing: -.01em; color: var(--yel);
    -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--pink); }
  .pn.pink { margin-top: 14px; background: var(--pink); color: var(--ink); font: 800 20px/1.5 var(--display); }
  .pn.pink .y, .pn.pink .b { -webkit-text-stroke: 1.4px var(--ink); paint-order: stroke fill; }
  .pn.pink .y { color: var(--yel); }
  .pn.pink .b { color: var(--sky); }
  .hero .cta { margin-top: 22px; }
  @media (max-width: 899px) { .catch .big { text-shadow: 3px 3px 0 var(--pink); } }
  .stage { position: relative; width: 100vw; margin: 0 calc(50% - 50vw) 10px; height: calc(var(--cw) * 1.41 * 1.22 + 40px); touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .deck { position: absolute; width: var(--cw); aspect-ratio: 400 / 564; border: 0; padding: 0; background: none; cursor: pointer; z-index: 5; }
  .deck img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: var(--rad); outline: 1.5px solid var(--ink); outline-offset: -.5px; box-shadow: var(--sh); }
  .deck img:nth-child(1) { transform: translate(-5px, 5px) rotate(-3deg); }
  .deck img:nth-child(2) { transform: translate(-2.5px, 2.5px) rotate(1.6deg); }
  .deck:active img:last-child { transform: translate(-1px, 1px); box-shadow: var(--sh-sm); }
  .deck:focus-visible { outline: 3px solid var(--ink); outline-offset: 10px; border-radius: 10px; }
  .card { position: absolute; top: 0; left: 0; width: var(--cw); aspect-ratio: 400 / 564; z-index: 10; cursor: grab; touch-action: none; will-change: transform; --o: 4px; }
  .card .in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3, 1.2, .45, 1); }
  .card.down .in { transform: rotateY(180deg); }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--rad); outline: 1.5px solid var(--ink); outline-offset: -.5px; box-shadow: var(--o) var(--o) 0 var(--ink); pointer-events: none; }
  .card img.b { transform: rotateY(180deg); box-shadow: calc(var(--o) * -1) var(--o) 0 var(--ink); } /* mirrored by the flip, so the shadow lands the same way */
  .card.held { cursor: grabbing; }
  .flood .nw { white-space: nowrap; }
  .stage { isolation: isolate; } /* the deck, its cards and its hint stay in their own layer, under an open design */
  .stage .hint { position: absolute; z-index: 3000; white-space: nowrap; pointer-events: none; font: 600 13px/1 var(--display); text-align: center; transition: opacity .3s; }
  .stage.touched .hint { opacity: 0; }

  /* designs: an endless strip that leans with your swipe and takes on each design's colour, in pastel */
  /* designs: the only panel on the page, Pluto's rescue card: inset from the edges, big rounded corners, a soft vertical gradient
     in two tints of the centred design's pastel (the layers cross-fade as the strip moves) */
  .designs { margin: 6px 16px 0; border-radius: 40px; text-align: center; padding-inline: 0; padding-top: 48px; background: linear-gradient(180deg, #9ce4fc, #d8f4fe 48%, var(--page)); isolation: isolate; border-end-start-radius: 0; border-end-end-radius: 0; padding-bottom: 88px; }
  .designs > h2, .designs > .lede { position: relative; margin-inline: 16px; }
  .designs > .lede { margin-inline: auto; padding-inline: 16px; max-width: 46ch; text-wrap: balance; }
  .bgs { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; overflow: hidden; z-index: -1; }
  .bgs i { position: absolute; inset: 0; opacity: 0; will-change: opacity; }
  .strip { direction: ltr; position: relative; display: flex; gap: 0; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 34px calc(50% - var(--dw) / 2) 22px; --dw: min(58vw, 250px); perspective: 900px; overscroll-behavior-x: contain; }
  .strip::-webkit-scrollbar { display: none; }
  .dz { direction: rtl; flex: none; width: var(--dw); scroll-snap-align: center; border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .dz .tilt { will-change: transform; transform-origin: 50% 85%; }
  .dz img { width: 100%; aspect-ratio: 400 / 564; border-radius: var(--rad); outline: 1.5px solid var(--ink); outline-offset: -.5px; box-shadow: var(--sh); }
  .dz .nm { display: block; margin-top: 32px; font: 700 15px/1 var(--display); }
  .strip-hint { position: relative; font: var(--b-weight) 13px/1 var(--display); letter-spacing: .04em; }
  .order { position: relative; margin-top: 30px; display: grid; justify-items: center; gap: 14px; padding-inline: 16px; }
  .order .pill { font-size: 18px; padding: 19px 30px; }
  .order .price { font: 700 20px/1 var(--display); }
  .wa-line { font-size: 15px; font-weight: 500; }

  /* the flood: a tap fills the screen with that design's pastel and lays out its front, back and real board */
  .flood { position: fixed; inset: 0; z-index: 900; background: var(--fc); color: var(--ink); visibility: hidden; touch-action: none; display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
  .flood.open { visibility: visible; }
  .flood .x { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 5; width: 48px; height: 48px; border-radius: 50%; border: 2.5px solid var(--ink); background: #fff; color: var(--ink); font: 900 22px/1 system-ui, sans-serif; box-shadow: var(--sh-sm); cursor: pointer; }
  .spread { display: grid; place-items: center; padding: 70px 16px 0; min-height: 0; }
  .flood { grid-template-rows: auto auto; align-content: center; } /* the board, the cards and the words sit together, centred on the screen */
  .tableau { position: relative; width: min(84vw, 600px, 62svh * 1.414); margin-bottom: calc(min(84vw, 600px, 62svh * 1.414) * .2); }
  .tableau .bd { width: 100%; aspect-ratio: 2200 / 1556; object-fit: cover; border-radius: 8px; outline: 2.5px solid var(--ink); outline-offset: -1px; box-shadow: var(--sh); transform: rotate(-2.5deg); }
  .tableau .fc { position: absolute; bottom: -22%; width: 31%; aspect-ratio: 400 / 564; border-radius: var(--rad); outline: 1.5px solid var(--ink); outline-offset: -.5px; box-shadow: var(--sh); }
  .tableau .fr { left: 17%; transform: rotate(-7deg); z-index: 2; }
  .tableau .bk { left: 50%; transform: rotate(6deg); }
  .tableau.solo { width: min(76vw, 440px, 44svh * 1.45); margin-bottom: 0; display: flex; justify-content: center; gap: 4%; }
  .tableau.solo .fc { position: relative; bottom: auto; left: auto; width: 48%; }
  .flood .info { display: grid; justify-items: center; gap: 12px; padding: 18px 16px max(26px, env(safe-area-inset-bottom)); text-align: center; }
  .flood h3 { margin: 0; font: var(--h-weight) clamp(36px, 10vw, 60px)/1 var(--display); letter-spacing: var(--h-track); }
  .flood .info p { margin: 0; font-size: 16px; }
  @media (min-width: 900px) { .flood .swipe { display: none; } }
  .flood .x { box-shadow: none !important; }
  @media (max-width: 899px) { .pn.pink .y, .pn.pink .b { -webkit-text-stroke-width: 1.6px; } }
  /* option b: the facts that help decide, quiet; option a hides them */
  .flood .fb { display: none; }
  body.flood-b .flood .fa { display: none; }
  body.flood-b .flood .fb { display: contents; }
  body.flood-b .flood .info { gap: 10px; }
  body.flood-b .flood h3 { order: 0; font-size: clamp(30px, 8.4vw, 48px); }
  .buy .pr { order: 1; margin: 0; font: var(--h-weight) clamp(30px, 8vw, 40px)/1 var(--display); }
  body.flood-b .flood .info { justify-items: start; text-align: start; width: min(100%, 452px); margin-inline: auto; }
  .buy .pr .tok { padding: 2px 6px; }
  body.flood-b .flood h3 + * + .buy, body.flood-b .buy .pr { margin-top: -4px; }
  .buy .ver { order: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(100%, 420px); margin: 2px 0 0; padding: 0; border: 0; min-width: 0; }
  .ver label { position: relative; display: grid; gap: 3px; align-content: start; padding-block: 10px 11px; padding-inline: 32px 12px; border: 1.5px solid var(--ink); border-radius: 14px; background: transparent; text-align: start; cursor: pointer; }
  .ver label::after { content: ''; position: absolute; inset-inline-start: 11px; top: 12px; width: 12px; height: 12px; border: 1.5px solid var(--ink); border-radius: 50%; background: #fff; }
  .ver label:has(input:checked) { background: #fff; box-shadow: var(--sh-sm); }
  .ver label:has(input:checked)::after { background: var(--ink); box-shadow: inset 0 0 0 2.5px #fff; }
  .ver label:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 3px; }
  .ver input { position: absolute; opacity: 0; pointer-events: none; }
  .ver b { font: var(--b-weight) 15px/1.15 var(--display); }
  .ver span { font-size: 13px; line-height: 1.25; }
  .ver label > span { white-space: nowrap; }
  .ver .tok { font-size: 12px; padding: 0 4px; }
  body.flood-b .flood .info > .pill { order: 3; width: min(100%, 420px); }
  .buy .note { order: 4; margin: -2px 0 0; font-size: 13px !important; opacity: .8; }
  .buy .inbox { order: 5; width: min(100%, 420px); text-align: start; }
  .inbox .hd { margin: 0 0 4px; font: var(--b-weight) 14px/1.2 var(--display); }
  .inbox ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; font-size: 14px; line-height: 1.35; }
  .inbox li { position: relative; padding-inline-start: 20px; }
  .inbox li::before { content: ''; position: absolute; right: 2px; top: .3em; width: 10px; height: 6px; border: solid var(--ink); border-width: 0 0 2px 2px; rotate: -45deg; }
  .buy .fronts { order: 6; display: none; justify-content: center; gap: 8px; }
  @media (min-height: 1000px) and (min-width: 900px) { body.flood-b .buy .fronts:not(:empty) { display: flex; } } /* the extra fronts only where they fit under the facts */
  body.flood-b .flood .swipe { order: 7; }
  /* short phones (an SE, or browser bars showing): a smaller board, and below 700 px the list goes so the choice and the button stay on screen */
  @media (max-height: 760px) { body.flood-b .tableau { width: min(76vw, 26svh * 1.414); margin-bottom: calc(min(76vw, 26svh * 1.414) * .2); } body.flood-b .flood h3 { font-size: 30px; } }

  // טריפה has no sheets, so its cards are its template renders.
  const D = {
    bachelorette: { name: 'פריז', c: '#fc789c', fronts: 8, back: 1 },
    birthday: { name: 'קליפורניה', c: '#9ce4fc', fronts: 1, back: 1 },
    grapefruit: { name: 'אואזיס', c: '#f07848', fronts: 1, back: 1 }, // the live shop's one front (its print template)
    marriage: { name: 'סנטוריני', c: '#0048a8', fronts: 1, back: 1 },
    daniel: { name: 'דני', c: '#f5d98f', fronts: 8, back: 1 },
    japanese: { name: 'טוקיו', c: '#b03a3a', fronts: 1, back: 1 }, // the koi red of its art, so its panel and flood are a pastel red, not grey
    posttrip: { name: 'סיישל', c: '#90d8e4', fronts: 8, back: 1 },
    football: { name: 'האלאנד', c: '#2a52be', fronts: 8, back: 1 },
    tarifa: { name: 'טריפה', c: '#3d6b2c', fronts: 1, back: 1 },
    kids: { name: 'ברוקלין', c: '#1878fc', fronts: 1, back: 1 },
  };
  for (const k in D) D[k].board = `boards12/${k}.webp`; // the preview's boards, so the two match
  // each design's colour, lifted most of the way to white: the same hue as a light pastel
  const tint = (h, f) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(h.slice(i, i + 2), 16) + (255 - parseInt(h.slice(i, i + 2), 16)) * f).toString(16).padStart(2, '0')).join('');
  const pastel = (h) => tint(h, .62);
  /* SHARED:START (copied into r12-designs.html) */
  // what a tapped design shows: its pastel, its board with a front and a back on it, its name, and (option b) a few more real fronts
  function fillFlood(root, k) {
    const d = D[k], tab = root.querySelector('.tableau');
    const v = [1, 3, 5].map((i) => parseInt(d.c.slice(i, i + 2), 16)), P = [255, 241, 222];
    root.style.setProperty('--fc', Math.max(...v) - Math.min(...v) >= 40 ? pastel(d.c) : '#' + v.map((x, i) => Math.round(x + (P[i] - x) * .62).toString(16).padStart(2, '0')).join(''));
    root.querySelector('h3').textContent = d.name;
    tab.className = 'tableau' + (d.board ? '' : ' solo');
    tab.innerHTML = (d.board ? `<img class="bd" src="${d.board}" alt="הלוח של ${d.name}">` : '')
      + `<img class="fc fr" src="${C}${k}-f1.webp" alt="קלף מהעיצוב ${d.name}">`
      + (d.back ? `<img class="fc bk" src="${C}${k}-b1.webp" alt="גב הקלף של ${d.name}">` : '');
    root.querySelector('.fronts').innerHTML = d.fronts > 1 ? [2, 3, 4].map((n) => `<img src="${C}${k}-f${n}.webp" alt="עוד קלף מהעיצוב ${d.name}">`).join('') : '';
  }
  
  const ALL = Object.keys(D), gal = document.getElementById('gal');
  const INFO = "    <div class=\"info\">\n      <h3></h3>\n      <p class=\"fa\">כל עיצוב מתאים לכל חגיגה - את הכותרת אתם כותבים<br /><span class=\"tok\">{price}</span></p>\n      <!-- option b: the live product page's buying block (product.html?design=marriage, 2026-10-16): the price large under the name, the button,\n           its note (\"מוכן תוך 4 ימי עסקים · ללא הגבלת מילים\"), and \"מה בפנים\" as ticked lines. How it reaches you is the checkout's choice\n           (collect.html: one printed game, delivery on top for the fee), shown here as two options; the enabled versions and the fee are /api/pricing's -->\n      <div class=\"fb facts buy\">\n        <p class=\"pr\"><span class=\"tok\">{price}</span></p>\n        <fieldset class=\"ver\">\n          <legend class=\"sr\">איך המשחק מגיע אליכם</legend>\n          <label><input type=\"radio\" name=\"ver\" value=\"pickup\" checked /><b>איסוף עצמי</b><span>תל אביב, בלי תוספת</span></label>\n          <label><input type=\"radio\" name=\"ver\" value=\"delivery\" /><b>משלוח עד הבית</b><span>בשליח <span class=\"tok\">+{delivery_fee}</span></span></label>\n        </fieldset>\n        <p class=\"note\">מוכן תוך 4 ימי עסקים · ללא הגבלת מילים</p>\n        <div class=\"inbox\">\n          <p class=\"hd\">מה בפנים</p>\n          <ul>\n            <li>חפיסת קלפים מותאמת אישית</li>\n            <li>לוח משחק</li>\n            <li>דף חוקים</li>\n            <li>חיילי משחק עם הפרצופים שלכם</li>\n          </ul>\n        </div>\n        <div class=\"fronts\"></div>\n      </div>\n      <a class=\"pill\" href=\"#\">בונים את המשחק<svg class=\"arr\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M19 12H5M11 6l-6 6 6 6\" /></svg></a>\n    </div>\n";
  gal.innerHTML = ALL.map((k, i) => `<section class="flood still" aria-label="${D[k].name}"><div class="spread"><div class="tableau"></div></div>${INFO.replace(/name="ver"/g, `name="ver${i}"`)}</section>`).join('');
  [...gal.children].forEach((el, i) => fillFlood(el, ALL[i]));
  const read = () => { const b = /flood=b/.test(location.hash); document.body.classList.toggle('flood-b', b); document.querySelectorAll('[data-fv]').forEach((a) => a.setAttribute('aria-current', String(a.dataset.fv === (b ? 'b' : 'a')))); };
  addEventListener('hashchange', read); read();
})();
</script>
</body>
</html>
