name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Cancel superseded PR runs; a push to main always runs to completion.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Format + Lint + Unit + E2E
    runs-on: ubuntu-latest
    # Bound worst-case cost: a hung E2E/webServer can otherwise burn the default
    # 6-hour job cap. Not a target — a BACKSTOP. It was 20, and the suite grew
    # into it: a run that finished test 900 of ~900 was cancelled one minute from
    # the end and reported as a failure, twice, on a branch whose tests all pass.
    # A cap that fires on healthy runs teaches everyone to re-run reds, which is
    # exactly how a real one gets waved through.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Install server dependencies
        run: cd server && (npm ci || npm install)
      - name: Prettier format check
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm run test:unit

      # --- E2E: iPhone 14 + Desktop Chrome, on BOTH pull_request AND push:main ---
      # These two profiles carry every device-gated spec (mobile-only checks run on
      # iPhone 14; layout/measurement specs are Desktop-Chrome-only), so together
      # they execute every merge-gating test.
      #
      # push:main runs E2E too — deliberately. It used to be skipped to save minutes,
      # on the assumption "the squashed PR already ran E2E green under review." That
      # assumption fails the moment a PR is merged PAST a red E2E check: main then has
      # no E2E net and a real break ships silently — which happened (#167 shipped a
      # broken home page; main's push CI was green only because E2E didn't run there).
      # One E2E run per merge is cheap insurance against that.
      # Cache the Chromium binary so runs don't re-download it each time (keyed on the
      # resolved Playwright version). On a cache hit `install` skips the download;
      # `install-deps` still installs the system libs (fast).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # WebKit joins Chromium here. It is a second download (cached above with it)
      # and it runs a SHORT list of specs — playwright.config.js pins the "Mobile
      # Safari" project to the layout checks with `testMatch` — because the whole
      # point is engine divergence in how a box is sized, not a second pass over
      # application logic. Everything an iPhone buyer sees was previously measured
      # in Chromium only, which is how a pawn card that draws ellipses off their
      # cut-lines on every iPhone passed every check we had.
      - name: Install Playwright browsers
        run: |
          npx playwright install-deps chromium webkit
          npx playwright install chromium webkit
      - name: E2E tests (iPhone 14 + Desktop Chrome + Mobile Safari)
        run: npx playwright test --project="iPhone 14" --project="Desktop Chrome" --project="Mobile Safari"

  # --- The Python generator ---------------------------------------------------
  # generator/ has 279 tests and CI has never run a single one of them: the job
  # above is Node-only, so the whole PDF pipeline — pack, topup, config, the deck
  # assembler, calibration — merged unguarded. A separate job so it runs in
  # PARALLEL with the Node suite and adds no wall-clock to it.
  python:
    name: Generator tests (pytest)
    runs-on: ubuntu-latest
    # Bound worst-case cost the same way the Node job does. The "about a minute"
    # this cap was written for is long gone: the suite is past 950 tests, dozens
    # of which drive real headless Chrome, and it now takes 7-10 minutes on a
    # runner (9m36s and 9m48s on main on 2026-08-08/09). At 10 the cap had
    # stopped catching hangs and started cancelling green suites over runner
    # variance, so it matches the Node job's 20.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The runtime image is node:20-alpine's python3. 3.11 is the closest
          # widely-available match; the generator is version-agnostic beyond that.
          python-version: '3.11'
          cache: 'pip'
          # pip caching needs a dependency file to key on; without this the
          # action fails outright ("No file matched to **/requirements.txt").
          cache-dependency-path: generator/requirements-dev.txt
      - name: Install Python dependencies
        # Test-only deps; the runtime image installs what the generator needs
        # through apk instead (see the file's own header).
        run: pip install -r generator/requirements-dev.txt
      # Several generator tests shell out to real headless Chrome. Two things have
      # to be true for them to mean anything here:
      #
      #  1. A browser exists. Without one they SOFT-skip — printing
      #     "(skipped: no Chrome)" and returning green — so a missing browser
      #     would look exactly like a passing render path. Assert it instead.
      #  2. CHROME points at it. render_page.CHROME defaults to the macOS bundle
      #     path ("/Applications/Google Chrome.app/..."), which is right for the
      #     owner's laptop and irrelevant on Linux; production sets CHROME through
      #     the Dockerfile wrapper. Without it here the tests do NOT skip (their
      #     detection helper finds google-chrome on PATH) — they run and die on
      #     FileNotFoundError. This is the failure the job's first green-ish run
      #     surfaced: 277 passed, 2 died on the macOS path.
      - name: Locate Chrome for the render tests
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable \
            || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome found — the Chrome-gated generator tests would silently skip."
            exit 1
          fi
          echo "Using $CHROME_BIN"
          echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Generator tests (pytest)
        # Run from generator/ — the tests import their modules by bare name
        # (`import pack`), which resolves via pytest putting the test file's own
        # directory on sys.path.
        run: npm run test:py
