name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Cancel superseded PR runs; a push to main always runs to completion.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- Fast gates -------------------------------------------------------------
  # Format, lint and the unit suite: about 90 seconds all told. Split out from the
  # E2E run so a missing semicolon is reported in a minute and a half instead of
  # waiting behind a quarter-hour of browsers.
  checks:
    name: Format + Lint + Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Install server dependencies
        run: cd server && (npm ci || npm install)
      - name: Prettier format check
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm run test:unit

  # --- E2E, SHARDED -----------------------------------------------------------
  # The suite is ~1900 tests (every spec on two device profiles) and took 15m36s
  # as one step — nearly the whole CI wall-clock, and close enough to the cap that
  # green runs were being cancelled a minute from the end. Playwright splits a run
  # by `--shard`, so the same tests now run on four runners at once: same tests,
  # same projects, nothing skipped, a quarter of the wall time.
  #
  # THE TWO PROFILES carry every device-gated spec (mobile-only checks run on
  # iPhone 14; layout/measurement specs are Desktop-Chrome-only), so together they
  # execute every merge-gating test. Mobile Safari is a real WebKit engine on a
  # short list of layout specs — see playwright.config.js for why the list is short.
  #
  # push:main runs E2E too — deliberately. It used to be skipped to save minutes,
  # on the assumption "the squashed PR already ran E2E green under review." That
  # assumption fails the moment a PR is merged PAST a red E2E check: main then has
  # no E2E net and a real break ships silently — which happened (#167 shipped a
  # broken home page; main's push CI was green only because E2E didn't run there).
  e2e:
    name: E2E ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # Each shard is ~a quarter of the suite. The cap is a backstop against a hung
    # webServer, not a target.
    timeout-minutes: 20
    strategy:
      # One shard failing must not cancel the other three: the whole point of a
      # test run is the full list of what broke, and a cancelled sibling reports
      # as a failure nobody can read.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Install server dependencies
        run: cd server && (npm ci || npm install)
      # Cache the browser binaries so runs don't re-download them each time (keyed
      # on the resolved Playwright version). On a cache hit `install` skips the
      # download; `install-deps` still installs the system libs (fast). A miss adds
      # about ten minutes, which is what used to push a whole run past its cap.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: |
          npx playwright install-deps chromium webkit
          npx playwright install chromium webkit
      - name: E2E tests (iPhone 14 + Desktop Chrome + Mobile Safari)
        run: npx playwright test --project="iPhone 14" --project="Desktop Chrome" --project="Mobile Safari" --shard=${{ matrix.shard }}/4

  # --- The Python generator ---------------------------------------------------
  # generator/ has 279 tests and CI has never run a single one of them: the job
  # above is Node-only, so the whole PDF pipeline — pack, topup, config, the deck
  # assembler, calibration — merged unguarded. A separate job so it runs in
  # PARALLEL with the Node suite and adds no wall-clock to it.
  python:
    name: Generator tests (pytest)
    runs-on: ubuntu-latest
    # Bound worst-case cost the same way the Node job does. The suite is 1077
    # tests, dozens of which drive real headless Chrome; it took 11m21s serially
    # and now runs one worker per file (see npm run test:py), which brought it to
    # about four and a half minutes locally. The cap stays generous: it is a
    # backstop against a hung Chrome, and a cap that fires on healthy runs only
    # teaches everyone to re-run reds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The runtime image is node:20-alpine's python3. 3.11 is the closest
          # widely-available match; the generator is version-agnostic beyond that.
          python-version: '3.11'
          cache: 'pip'
          # pip caching needs a dependency file to key on; without this the
          # action fails outright ("No file matched to **/requirements.txt").
          cache-dependency-path: generator/requirements-dev.txt
      - name: Install Python dependencies
        # Test-only deps; the runtime image installs what the generator needs
        # through apk instead (see the file's own header).
        run: pip install -r generator/requirements-dev.txt
      # Several generator tests shell out to real headless Chrome. Two things have
      # to be true for them to mean anything here:
      #
      #  1. A browser exists. Without one they SOFT-skip — printing
      #     "(skipped: no Chrome)" and returning green — so a missing browser
      #     would look exactly like a passing render path. Assert it instead.
      #  2. CHROME points at it. render_page.CHROME defaults to the macOS bundle
      #     path ("/Applications/Google Chrome.app/..."), which is right for the
      #     owner's laptop and irrelevant on Linux; production sets CHROME through
      #     the Dockerfile wrapper. Without it here the tests do NOT skip (their
      #     detection helper finds google-chrome on PATH) — they run and die on
      #     FileNotFoundError. This is the failure the job's first green-ish run
      #     surfaced: 277 passed, 2 died on the macOS path.
      - name: Locate Chrome for the render tests
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable \
            || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome found — the Chrome-gated generator tests would silently skip."
            exit 1
          fi
          echo "Using $CHROME_BIN"
          echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Generator tests (pytest)
        # Run from generator/ — the tests import their modules by bare name
        # (`import pack`), which resolves via pytest putting the test file's own
        # directory on sys.path. The script carries the xdist flags, so a laptop
        # run and a CI run are the same run.
        run: npm run test:py

  # --- One check to read ------------------------------------------------------
  # Six jobs now report where two used to. This is the single check that says
  # "everything passed": it fails if ANY of them did not, including a cancelled or
  # skipped shard — `needs` alone would let those through, because a job that never
  # ran is not a job that failed.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [checks, e2e, python]
    if: always()
    steps:
      - name: Every job green
        run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "e2e:    ${{ needs.e2e.result }}"
          echo "python: ${{ needs.python.result }}"
          [ "${{ needs.checks.result }}" = "success" ] \
            && [ "${{ needs.e2e.result }}" = "success" ] \
            && [ "${{ needs.python.result }}" = "success" ]
